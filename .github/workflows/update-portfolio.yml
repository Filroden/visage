name: Trigger Portfolio Rebuild

on:
  release:
    types: [published]
  gollum:

jobs:
  build:
    runs-on: ubuntu-latest
    # Run on any wiki edit, or on a release that isn't a pre-release
    if: github.event_name == 'gollum' || github.event.release.prerelease == false
    steps:
      - name: Ping Cloudflare Pages
        run: curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
        
